name: Sync Mirsad opportunities

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check the server connection without changing catalog data or using AI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirsad-opportunity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Instagram reader
        run: python -m pip install --disable-pip-version-check --no-input instaloader
      - name: Verify official announcements and update Supabase
        run: |
          if [ "$BOT_CHECK_ONLY" = "true" ]; then
            node scripts/sync-opportunities.mjs --check-connection
          else
            npm run sync:opportunities
          fi
        env:
          BOT_VERIFICATION_MODE: official_source
          BOT_CHECK_ONLY: ${{ inputs.check_only }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTALOADER_ENABLED: "true"
